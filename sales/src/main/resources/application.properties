spring.application.name=sales
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=sales
spring.datasource.username=${DB_USER:sales_user}
spring.datasource.password=${DB_PASSWORD:sales_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=sales
spring.flyway.default-schema=sales

# Service-to-service addresses, resolved by Docker's embedded DNS. `catalog` and
# `payment` are single containers; `inventory` is two, reached through a shared
# network alias whose A records Docker's DNS rotates. These calls stay inside the
# network: caller to callee, nothing in between.
catalog.service.url=${CATALOG_URL:http://localhost:8081}
inventory.service.url=${INVENTORY_URL:http://localhost:8082}
payment.service.url=${PAYMENT_URL:http://localhost:8084}

# Bound every outbound call. sales touches three services per order, so an
# unbounded wait on any one of them holds the request and its thread hostage.
clients.connect-timeout-ms=1000
clients.read-timeout-ms=2000
# Payment gets longer: a card authorisation legitimately takes more time than a
# database read, and a timeout below a dependency's normal latency is a
# self-inflicted outage that also risks abandoning work the callee completed.
clients.payment-read-timeout-ms=5000

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,ratelimiterevents,bulkheads,bulkheadevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# ---------------------------------------------------------------------------
# Resilience4j: one breaker per dependency, deliberately not one policy for all
# ---------------------------------------------------------------------------
# A call ends up in one of THREE buckets: recorded as a failure, ignored
# entirely, or (by default, for anything unlisted) counted as a success.
#
# Only genuine transport failures are recorded. Business answers -- 404 no such
# product, 409 out of stock, 402 declined -- arrive as DependencyBusinessException
# and are explicitly ignored, so they neither trip the breaker nor pad its
# success count. A breaker that counts declines will eventually cut off a
# payment provider that was working perfectly.
resilience4j.circuitbreaker.configs.default.record-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.configs.default.record-exceptions[1]=org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=com.finalearth.sales.exception.DependencyBusinessException
# The rate limiter and the bulkhead sit INSIDE the breaker in Resilience4j's fixed
# aspect order, so their rejections pass through its accounting on the way out.
# These are calls sales refused to make -- they are evidence about sales' own load,
# not about the dependency, and left unlisted they would fall through to the
# default and be counted as SUCCESSES, propping up the success rate at exactly the
# moment the system is saturated.
resilience4j.circuitbreaker.configs.default.ignore-exceptions[1]=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.circuitbreaker.configs.default.ignore-exceptions[2]=io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.circuitbreaker.instances.catalog.base-config=default
resilience4j.circuitbreaker.instances.inventory.base-config=default
resilience4j.circuitbreaker.instances.payment.base-config=default
# Payment is allowed to be slower before a call counts as slow, matching its
# longer read timeout.
resilience4j.circuitbreaker.instances.payment.slow-call-duration-threshold=3s

# Retry is configured for catalog ONLY. GET /api/products/{id} is idempotent, so
# asking twice is free. The two write paths -- inventory reserve and payment
# charge -- have no @Retry annotation at all, because a lost response does not
# mean a lost request: retrying could double-reserve stock or double-charge a
# card. See the javadoc on InventoryClient and PaymentClient.
resilience4j.retry.instances.catalog.max-attempts=3
resilience4j.retry.instances.catalog.wait-duration=200ms
resilience4j.retry.instances.catalog.enable-exponential-backoff=true
resilience4j.retry.instances.catalog.exponential-backoff-multiplier=2
resilience4j.retry.instances.catalog.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.catalog.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.catalog.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException
# Retrying into a limit that is already saturated is the definition of making it
# worse: the retry consumes another permit or another slot that a first-time caller
# could have used, and is almost certain to be refused again anyway.
resilience4j.retry.instances.catalog.ignore-exceptions[1]=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.retry.instances.catalog.ignore-exceptions[2]=io.github.resilience4j.bulkhead.BulkheadFullException

# ---------------------------------------------------------------------------
# Bulkhead: SEMAPHORE, one per dependency
# ---------------------------------------------------------------------------
# A semaphore bulkhead is a counter, not a thread pool. It runs the call on the
# caller's own Tomcat thread and refuses to start more than max-concurrent-calls
# at once. That is the right choice here because nothing on these paths needs to
# be abandoned mid-flight -- the thread-pool variant only earns its extra cost in
# catalog, where a time limiter has to be able to walk away from a stalled read.
#
# The sizes are the pattern. Tomcat will hand out ~200 threads to whatever asks;
# these caps say how many of them may be blocked on each dependency at once, so a
# single sick service can consume its slice and no more. Without them, one slow
# dependency drains the whole pool and takes down the order path entirely --
# including the orders that would not have touched it.
#
# max-wait-duration=0: refuse immediately rather than queue. Queueing for a slot
# holds the very thread the bulkhead is trying to protect, and it converts a fast,
# legible rejection into unexplained latency.
resilience4j.bulkhead.configs.default.max-wait-duration=0
resilience4j.bulkhead.configs.default.writable-stack-trace-enabled=false

# Loosest: every line of every order calls this, and it is a cheap idempotent read.
resilience4j.bulkhead.instances.catalog.base-config=default
resilience4j.bulkhead.instances.catalog.max-concurrent-calls=20
# Tighter: reservations mutate shared state and contend on the same rows, and there
# is exactly one per order against several price lookups.
resilience4j.bulkhead.instances.inventory.base-config=default
resilience4j.bulkhead.instances.inventory.max-concurrent-calls=15
# Tightest, and it is also the slowest call (5s read timeout), so each occupied slot
# is held far longer than one of catalog's.
resilience4j.bulkhead.instances.payment.base-config=default
resilience4j.bulkhead.instances.payment.max-concurrent-calls=10

# ---------------------------------------------------------------------------
# Rate limiter: a ceiling on calls STARTED per second
# ---------------------------------------------------------------------------
# Distinct from the bulkhead and not implied by it. The bulkhead caps concurrency;
# this caps arrival rate. Twenty concurrent catalog calls at 5ms each is roughly
# 4000 calls per second -- comfortably inside the bulkhead, far outside this.
#
# timeout-duration=0 for the same reason max-wait-duration is: a caller with no
# permit is refused now rather than parked holding a thread.
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=0
resilience4j.ratelimiter.configs.default.register-health-indicator=true

resilience4j.ratelimiter.instances.catalog.base-config=default
resilience4j.ratelimiter.instances.catalog.limit-for-period=100
resilience4j.ratelimiter.instances.inventory.base-config=default
resilience4j.ratelimiter.instances.inventory.limit-for-period=50
# Payment's number is the one that is not an engineering judgement. A provider's
# TPS ceiling is a contractual figure, and setting ours just below theirs converts
# their enforcement -- opaque, and applied to whichever requests arrive last --
# into our own, which we can see, log and explain.
resilience4j.ratelimiter.instances.payment.base-config=default
resilience4j.ratelimiter.instances.payment.limit-for-period=25

logging.level.r4j=INFO

# Print the MDC request id on every line, so one request -- including all
# its retries and the circuit-breaker events it triggered -- can be isolated
# with `docker compose logs sales | grep <reqId>`.
logging.pattern.correlation=[${spring.application.name:},%X{reqId:-}] 
