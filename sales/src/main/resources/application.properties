spring.application.name=sales
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=sales
spring.datasource.username=${DB_USER:sales_user}
spring.datasource.password=${DB_PASSWORD:sales_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=sales
spring.flyway.default-schema=sales

# The only service sales still calls over HTTP. inventory and payment used to be here
# too; they are reached by publishing an event now, so their addresses are gone rather
# than merely unused. Pricing stays synchronous because it is a read whose answer the
# order cannot be written without -- there is nothing about it to defer.
catalog.service.url=${CATALOG_URL:http://localhost:8081}

clients.connect-timeout-ms=1000
clients.read-timeout-ms=2000

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,ratelimiterevents,bulkheads,bulkheadevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
# Inside Docker this is kafka:9092; from the host it is localhost:29092. Those are two
# advertised listeners on one broker, not two brokers -- see docker-compose.yml.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}

# String in, string out, both directions. The alternative -- Spring's JsonSerializer --
# stamps the producer's fully-qualified Java class name into a `__TypeId__` header and the
# consumer instantiates that class by name. It is convenient inside one codebase and a trap
# across services: it makes `com.finalearth.sales.event.OrderPlacedEvent` part of the wire
# contract, so renaming a package in the producer breaks a consumer that was never
# recompiled. The payload is already serialised in the outbox anyway; the relay publishes
# those exact bytes and each consumer maps them to whatever local record it likes.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# acks=all: the leader answers only once every in-sync replica has the record. With one
# broker that is a formality, but it is the setting that matters the moment there is a
# second one, and a default of acks=1 silently loses records on leader failover.
spring.kafka.producer.acks=all
# Removes duplicates caused by the producer's OWN internal retries by sequencing records
# per partition. It does not make the relay exactly-once -- a restart begins a new producer
# session with a new producer id, so a redelivery across a crash is still possible. That is
# what the consumers' inbox is for.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=3

spring.kafka.consumer.group-id=sales
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# A brand-new group starts at the beginning of the topic rather than skipping whatever is
# already there. That is what makes the retained log a replayable history instead of a
# queue that only helps consumers who were already listening.
spring.kafka.consumer.auto-offset-reset=earliest
# Offsets are committed by the listener container after the listener returns, never on a
# timer. Auto-commit acknowledges records the moment they are polled -- so a crash mid-batch
# loses every record already fetched but not yet handled, turning at-least-once into
# at-most-once without saying so.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Explicit because it matters here: a service consumes topics that OTHER services declare,
# so at a cold start its topics may not exist for a second or two. Fatal would mean the
# listener container refuses to start and the service comes up permanently deaf. False lets
# it keep looking, and auto-offset-reset=earliest means nothing published in the meantime is
# missed once the topic appears.
spring.kafka.listener.missing-topics-fatal=false

# How often the relay looks for committed-but-unpublished events. This interval is the
# floor on end-to-end saga latency: four hops means up to four of these on top of the
# actual work. Lower it and the query runs more often against a normally-empty index.
outbox.relay.interval-ms=500
outbox.relay.batch-size=100
outbox.relay.send-timeout-ms=5000

# ---------------------------------------------------------------------------
# Resilience4j -- now scoped to catalog alone
# ---------------------------------------------------------------------------
# The inventory and payment breakers, bulkheads and rate limiters are gone with the clients
# they guarded, and that removal is the clearest statement of what Kafka changed here.
# Those patterns all exist to answer one question: what does a caller do when the callee
# cannot be reached right now? Publishing to a durable log does not raise the question --
# the broker holds the event until inventory and payment are healthy enough to read it, and
# a consumer that is down is a consumer with lag, not a failed call.
#
# catalog keeps the full stack because it is still a synchronous request/response call, and
# every argument in Labs 04 and 05 still applies to it unchanged.
resilience4j.circuitbreaker.configs.default.record-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.configs.default.record-exceptions[1]=org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=com.finalearth.sales.exception.DependencyBusinessException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[1]=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.circuitbreaker.configs.default.ignore-exceptions[2]=io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.circuitbreaker.instances.catalog.base-config=default

# GET /api/products/{id} is idempotent, so asking twice is free.
resilience4j.retry.instances.catalog.max-attempts=3
resilience4j.retry.instances.catalog.wait-duration=200ms
resilience4j.retry.instances.catalog.enable-exponential-backoff=true
resilience4j.retry.instances.catalog.exponential-backoff-multiplier=2
resilience4j.retry.instances.catalog.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.catalog.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.catalog.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.retry.instances.catalog.ignore-exceptions[1]=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.retry.instances.catalog.ignore-exceptions[2]=io.github.resilience4j.bulkhead.BulkheadFullException

resilience4j.bulkhead.configs.default.max-wait-duration=0
resilience4j.bulkhead.configs.default.writable-stack-trace-enabled=false
resilience4j.bulkhead.instances.catalog.base-config=default
resilience4j.bulkhead.instances.catalog.max-concurrent-calls=20

resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=0
resilience4j.ratelimiter.configs.default.register-health-indicator=true
resilience4j.ratelimiter.instances.catalog.base-config=default
resilience4j.ratelimiter.instances.catalog.limit-for-period=100

logging.level.r4j=INFO

# Print the MDC request id on every line. On the HTTP path that is the inbound request id;
# on the Kafka path the listener sets it to `order-<id>`, so one order's whole saga --
# across every topic it travelled -- comes back from a single grep.
logging.pattern.correlation=[${spring.application.name:},%X{reqId:-}]
