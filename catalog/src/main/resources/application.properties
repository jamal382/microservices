spring.application.name=catalog
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=catalog
spring.datasource.username=${DB_USER:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog

# One name, two replicas: `inventory1` and `inventory2` share the `inventory`
# Docker network alias, so this address resolves to both A records and Docker's
# embedded DNS rotates between them.
inventory.service.url=${INVENTORY_URL:http://localhost:8082}

# Bound every outbound call. Without these a stalled inventory replica holds a
# thread indefinitely, and the circuit breaker never sees a failure to count
# because the call simply never finishes. These are the *real* bound: they are
# the only limits the blocked worker thread itself observes. The time limiter
# below bounds what the CALLER waits for, which is a different thing.
clients.connect-timeout-ms=1000
clients.read-timeout-ms=2000

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,ratelimiterevents,bulkheads,bulkheadevents,timelimiters,timelimiterevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# ---------------------------------------------------------------------------
# Resilience4j: catalog -> inventory
# ---------------------------------------------------------------------------
# A call ends up in one of THREE buckets, not two, and the difference matters:
#
#   record-exceptions  -> counted as a FAILURE, pushes the breaker toward OPEN
#   ignore-exceptions  -> not counted at all, as if the call never happened
#   everything else    -> counted as a SUCCESS, holding the breaker CLOSED
#
# Only genuine transport failures are recorded. Getting this list wrong is the
# classic mistake: count 404s and browsing unstocked products will trip the
# breaker and cut off a service that was never unhealthy.
resilience4j.circuitbreaker.instances.inventory.record-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.inventory.record-exceptions[1]=org.springframework.web.client.ResourceAccessException
# The time limiter's deadline is a real failure of the dependency: too slow to be
# useful is a way of being unavailable, and the breaker should react to it.
resilience4j.circuitbreaker.instances.inventory.record-exceptions[2]=java.util.concurrent.TimeoutException

# StockNotFoundException is inventory correctly reporting no stock row. Listing
# it as ignored rather than leaving it to fall through to "success" is the more
# honest choice: it is not evidence of a problem, but it is not evidence of
# health either, and a flood of 404s should not pad the success count and mask
# real failures happening alongside them.
resilience4j.circuitbreaker.instances.inventory.ignore-exceptions[0]=com.finalearth.catalog.exception.StockNotFoundException
# The rate limiter and the bulkhead sit INSIDE the breaker (see the aspect order
# in InventoryClient), so their rejections pass through its accounting on the way
# out. Both are calls this service refused to make -- they say nothing whatsoever
# about inventory's health, and left unlisted they would default to "success" and
# inflate the success rate at exactly the moment the system is under stress.
resilience4j.circuitbreaker.instances.inventory.ignore-exceptions[1]=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.circuitbreaker.instances.inventory.ignore-exceptions[2]=io.github.resilience4j.bulkhead.BulkheadFullException

# COUNT_BASED over the last 10 calls: open once half of them are failing. A
# time-based window would be the better production choice under bursty traffic;
# a count window is used here because it makes the demo deterministic -- you can
# say exactly which request will trip it.
resilience4j.circuitbreaker.instances.inventory.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
# Do not judge before there is evidence: with fewer than 5 recorded calls the
# breaker stays closed regardless of rate, so one unlucky failure at startup
# cannot open it.
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5

# A call that takes over a second is treated as a failure even when it succeeds.
# Slow is its own failure mode: a dependency answering just under the timeout is
# more corrosive than one that is plainly down, because nothing ever errors.
resilience4j.circuitbreaker.instances.inventory.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.instances.inventory.slow-call-rate-threshold=50

# Stay open 10s, then admit 3 trial calls in HALF_OPEN. If they pass, close; if
# not, open again. This is the recovery probe -- the breaker's way of asking
# "are you better yet?" without resuming full traffic.
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventory.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventory.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.inventory.register-health-indicator=true

# Retry: safe here because GET /api/stock/{id} is idempotent -- reading twice is
# indistinguishable from reading once. Contrast with sales, where the write
# paths deliberately do not retry.
resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=200ms
# Back off exponentially so a struggling dependency is not hit by a wall of
# simultaneous retries from every caller at once.
resilience4j.retry.instances.inventory.enable-exponential-backoff=true
resilience4j.retry.instances.inventory.exponential-backoff-multiplier=2
resilience4j.retry.instances.inventory.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.inventory.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException
# A deadline miss is worth one more attempt: the replica DNS hands back next time
# may not be the slow one.
resilience4j.retry.instances.inventory.retry-exceptions[2]=java.util.concurrent.TimeoutException
# Once the breaker is open it fails instantly; retrying that just burns the
# budget on a call that never leaves the process.
resilience4j.retry.instances.inventory.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.retry.instances.inventory.ignore-exceptions[1]=com.finalearth.catalog.exception.StockNotFoundException
# Retrying into a limit that is already saturated is the definition of making it
# worse -- the retry would consume another permit or another queue slot that a
# first-time caller could have used, and would almost certainly be refused again.
# Both fail straight to the fallback instead.
resilience4j.retry.instances.inventory.ignore-exceptions[2]=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.retry.instances.inventory.ignore-exceptions[3]=io.github.resilience4j.bulkhead.BulkheadFullException

# ---------------------------------------------------------------------------
# Time limiter: a deadline for the caller, on top of the socket timeouts
# ---------------------------------------------------------------------------
# The socket timeouts bound each I/O step separately -- 1s to connect, then 2s to
# read -- so one attempt can legitimately take 3s before either of them fires.
# This bounds the WHOLE attempt with a single number the caller can reason about.
#
# 1.5s is deliberately below the 2s read timeout so the deadline is what fires
# first on a stalled replica, and the behaviour is unambiguous when you inject a
# SLOW fault. Note what that means: the caller is released at 1.5s but the
# bulkhead thread stays blocked in the socket read until 2s, because a thread
# parked on blocking I/O cannot be interrupted. Cancelling a future cancels the
# *waiting*, never the work.
resilience4j.timelimiter.instances.inventory.timeout-duration=1500ms
resilience4j.timelimiter.instances.inventory.cancel-running-future=true

# When the deadline fires, it is this scheduler -- not the bulkhead pool -- that
# completes the future, so it is this scheduler's thread that runs the circuit
# breaker's accounting, the retry's decision and the fallback. Without these two
# lines Resilience4j quietly builds its own plain executor, and every log line on
# the timeout path comes out with an empty reqId: the failure path, which is the
# one you actually need to correlate, is the only one you cannot.
resilience4j.scheduled.executor.core-pool-size=4
resilience4j.scheduled.executor.context-propagators[0]=com.finalearth.catalog.config.MdcContextPropagator

# ---------------------------------------------------------------------------
# Bulkhead: a cap on how much of catalog can be tied up in inventory calls
# ---------------------------------------------------------------------------
# THREADPOOL rather than SEMAPHORE because the time limiter needs the call to run
# somewhere it can be abandoned. The trade is real: a semaphore bulkhead is free
# and keeps the caller's thread, while this one costs a thread hand-off and a
# context switch on every call.
#
# The sizing is the point of the pattern. Tomcat will happily give 200 threads to
# whatever asks; this says at most 16 of them may be waiting on inventory at once,
# with 32 more requests allowed to queue. Past that, callers are refused in
# microseconds and fall back, and catalog keeps serving GET /api/products/{id} --
# which needs nothing from inventory -- at full speed while inventory is unwell.
resilience4j.thread-pool-bulkhead.instances.inventory.core-thread-pool-size=8
resilience4j.thread-pool-bulkhead.instances.inventory.max-thread-pool-size=16
resilience4j.thread-pool-bulkhead.instances.inventory.queue-capacity=32
resilience4j.thread-pool-bulkhead.instances.inventory.keep-alive-duration=1s
# MDC is a ThreadLocal, so without this the reqId in logging.pattern.correlation
# is blank on every line the inventory call produces -- see MdcContextPropagator.
resilience4j.thread-pool-bulkhead.instances.inventory.context-propagators[0]=com.finalearth.catalog.config.MdcContextPropagator

# ---------------------------------------------------------------------------
# Rate limiter: a ceiling on the rate, independent of the concurrency cap
# ---------------------------------------------------------------------------
# The bulkhead caps how many calls are in flight at once; this caps how many may
# START per second. They are not the same limit and neither implies the other:
# 16 concurrent calls that each take 5ms is over 3000 calls per second, well
# inside the bulkhead and far outside this.
#
# timeout-duration=0 means a caller with no permit is refused immediately rather
# than parked waiting for one. Waiting would hold the very thread the bulkhead
# exists to protect, and would convert a fast, honest rejection into latency the
# caller cannot see the reason for.
resilience4j.ratelimiter.instances.inventory.limit-for-period=100
resilience4j.ratelimiter.instances.inventory.limit-refresh-period=1s
resilience4j.ratelimiter.instances.inventory.timeout-duration=0
resilience4j.ratelimiter.instances.inventory.register-health-indicator=true

logging.level.r4j=INFO

# Print the MDC request id on every line, so one request -- including all
# its retries and the circuit-breaker events it triggered -- can be isolated
# with `docker compose logs catalog | grep <reqId>`.
logging.pattern.correlation=[${spring.application.name:},%X{reqId:-}] 
