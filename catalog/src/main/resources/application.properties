spring.application.name=catalog
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=catalog
spring.datasource.username=${DB_USER:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog

# --- Service discovery (Eureka) ---
# This service is a registry *consumer* only: it looks `inventory` up, but is
# itself reached by a fixed address, so it does not register. Registration and
# discovery are independent switches -- this is the pair that separates them.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true

# How stale the local registry snapshot may get. Everything the load balancer
# sees comes from this cache, not from a live call to Eureka.
eureka.client.registry-fetch-interval-seconds=10

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
