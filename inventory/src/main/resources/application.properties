spring.application.name=inventory
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=inventory
spring.datasource.username=${DB_USER:inventory_user}
spring.datasource.password=${DB_PASSWORD:inventory_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=inventory
spring.flyway.default-schema=inventory

# --- Service discovery (Eureka) ---
# Inventory is the only service in the registry: it is the one that runs as
# several replicas, so it is the one whose address cannot be written down. It
# registers but does not fetch -- it makes no outbound calls of its own.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=false

# Register by IP. A container's hostname is not resolvable from outside that
# container, so hostname-based registration breaks under Docker.
eureka.instance.prefer-ip-address=true

# Unique per instance -- REQUIRED for scaling. Without it both replicas register
# under one id and overwrite each other, so the registry only ever shows one.
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# Faster than the defaults (30s heartbeat / 90s expiry) so a stopped instance
# leaves the registry in ~30s instead of ~90s.
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
