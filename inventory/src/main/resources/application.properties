spring.application.name=inventory
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=inventory
spring.datasource.username=${DB_USER:inventory_user}
spring.datasource.password=${DB_PASSWORD:inventory_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=inventory
spring.flyway.default-schema=inventory

# Inventory announces itself to nobody. It is the service that runs as several
# replicas, and both of them answer to the shared `inventory` network alias --
# so its callers find it through Docker's DNS. It makes no outbound calls of
# its own.
#
# /actuator/health reports readiness, but nothing in the request path consults
# it: Docker's DNS hands out both A records regardless of what health says.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Lab-only: exposes /api/lab/fault, which can make this replica return 500s or
# stall on demand. Off unless explicitly enabled (docker-compose.yml turns it on)
# because the endpoint is unauthenticated and can take the service down.
lab.fault-injection.enabled=${LAB_FAULT_INJECTION:false}

# Print the MDC request id on every line, so one request -- including all
# its retries and the circuit-breaker events it triggered -- can be isolated
# with `docker compose logs inventory | grep <reqId>`.
logging.pattern.correlation=[${spring.application.name:},%X{reqId:-}] 
