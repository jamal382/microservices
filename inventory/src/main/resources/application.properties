spring.application.name=inventory
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=inventory
spring.datasource.username=${DB_USER:inventory_user}
spring.datasource.password=${DB_PASSWORD:inventory_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=inventory
spring.flyway.default-schema=inventory

# Inventory announces itself to nobody. It is the service that runs as several
# replicas, and both of them answer to the shared `inventory` network alias --
# so its callers find it through Docker's DNS. It makes no outbound calls of
# its own.
#
# /actuator/health reports readiness, but nothing in the request path consults
# it: Docker's DNS hands out both A records regardless of what health says.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Lab-only: exposes /api/lab/fault, which can make this replica return 500s or
# stall on demand. Off unless explicitly enabled (docker-compose.yml turns it on)
# because the endpoint is unauthenticated and can take the service down.
lab.fault-injection.enabled=${LAB_FAULT_INJECTION:false}

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}

# Strings on the wire in both directions. Spring's JsonSerializer would stamp the
# producer's fully-qualified Java class name into a `__TypeId__` header for the consumer to
# instantiate by name -- turning a package rename in one service into a runtime failure in
# another. The payload is already serialised in the outbox, so the relay publishes those
# exact bytes and each consumer maps them to whatever local record it likes.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=3

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Offsets are committed after the listener returns, never on a timer. Auto-commit
# acknowledges records the moment they are polled, so a crash mid-batch loses everything
# fetched but not yet handled -- at-most-once, without ever saying so.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Explicit because it matters here: a service consumes topics that OTHER services declare,
# so at a cold start its topics may not exist for a second or two. Fatal would mean the
# listener container refuses to start and the service comes up permanently deaf. False lets
# it keep looking, and auto-offset-reset=earliest means nothing published in the meantime is
# missed once the topic appears.
spring.kafka.listener.missing-topics-fatal=false

outbox.relay.interval-ms=500
outbox.relay.batch-size=100
outbox.relay.send-timeout-ms=5000

# THE most important line in this file. Both containers read it, so both join the same
# group -- which is what makes them split the partitions of order.placed instead of each
# consuming every record. Give the two replicas different group ids and every order gets
# reserved twice, silently, with no error anywhere.
spring.kafka.consumer.group-id=inventory

# Print the MDC request id on every line, so one request -- including all
# its retries and the circuit-breaker events it triggered -- can be isolated
# with `docker compose logs inventory | grep <reqId>`.
logging.pattern.correlation=[${spring.application.name:},%X{reqId:-}] 
