spring.application.name=eureka-server
server.port=${SERVER_PORT:8761}

# A standalone registry must not try to register with, or fetch from, itself.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Learning-only: self-preservation stops eviction when many heartbeats are lost
# at once, on the assumption of a network partition. With it on, a service you
# deliberately stopped lingers in the dashboard and makes the exercise confusing.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
