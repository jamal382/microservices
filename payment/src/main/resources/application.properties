spring.application.name=payment
server.port=${SERVER_PORT:8084}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices}?currentSchema=payment
spring.datasource.username=${DB_USER:payment_user}
spring.datasource.password=${DB_PASSWORD:payment_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=payment
spring.flyway.default-schema=payment

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}

# Strings on the wire in both directions. Spring's JsonSerializer would stamp the
# producer's fully-qualified Java class name into a `__TypeId__` header for the consumer to
# instantiate by name -- turning a package rename in one service into a runtime failure in
# another. The payload is already serialised in the outbox, so the relay publishes those
# exact bytes and each consumer maps them to whatever local record it likes.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=3

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Offsets are committed after the listener returns, never on a timer. Auto-commit
# acknowledges records the moment they are polled, so a crash mid-batch loses everything
# fetched but not yet handled -- at-most-once, without ever saying so.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Explicit because it matters here: a service consumes topics that OTHER services declare,
# so at a cold start its topics may not exist for a second or two. Fatal would mean the
# listener container refuses to start and the service comes up permanently deaf. False lets
# it keep looking, and auto-offset-reset=earliest means nothing published in the meantime is
# missed once the topic appears.
spring.kafka.listener.missing-topics-fatal=false

outbox.relay.interval-ms=500
outbox.relay.batch-size=100
outbox.relay.send-timeout-ms=5000

spring.kafka.consumer.group-id=payment

# Print the MDC request id on every line, so one request -- including all
# its retries and the circuit-breaker events it triggered -- can be isolated
# with `docker compose logs payment | grep <reqId>`.
logging.pattern.correlation=[${spring.application.name:},%X{reqId:-}] 
