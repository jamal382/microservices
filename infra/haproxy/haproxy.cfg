global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

# Docker's embedded DNS. This is what makes server-template below re-resolve
# backends on the fly instead of pinning whatever IP existed at startup --
# see the comment on server-template for why that distinction matters.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries       3
    timeout resolve       1s
    timeout retry         1s
    hold valid            5s
    hold other            5s
    hold refused          5s
    hold nx               5s
    hold timeout          5s

frontend api_gateway
    bind *:80

    # Propagate the caller's identity to the backend.
    option forwardfor
    http-request set-header X-Forwarded-Proto http

    acl is_catalog   path_beg /api/products
    acl is_inventory path_beg /api/stock
    acl is_sales     path_beg /api/orders
    acl is_payment   path_beg /api/payments
    acl is_pgadmin   path_beg /pgadmin

    use_backend catalog_backend   if is_catalog
    use_backend inventory_backend if is_inventory
    use_backend sales_backend     if is_sales
    use_backend payment_backend   if is_payment
    use_backend pgadmin_backend   if is_pgadmin

    default_backend sales_backend

# catalog is a single container today, but the template still allocates 5
# slots so scaling it later (PRD 5.3) needs no config change here.
backend catalog_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server-template catalog 5 catalog:8081 check resolvers docker init-addr none

# inventory is already 2 containers (inventory1, inventory2) sharing the
# `inventory` network alias -- Docker's DNS returns both A records for that
# name, so this one backend definition covers both replicas without naming
# either container.
backend inventory_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server-template inventory 5 inventory:8082 check resolvers docker init-addr none

backend sales_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server-template sales 5 sales:8083 check resolvers docker init-addr none

backend payment_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server-template payment 5 payment:8084 check resolvers docker init-addr none

# pgAdmin is a UI, not an API, and it is the odd one out here in three ways.
#
# The path prefix is NOT stripped. pgAdmin is told its own mount point via
# SCRIPT_NAME=/pgadmin (docker-compose.yml), so it generates every internal link,
# redirect and static asset URL already carrying the prefix. Rewriting the path
# here would break every one of those the moment the browser followed them.
#
# Longer timeouts than the `defaults` 30s: pgAdmin holds connections open for
# query execution and its own polling, and 30s would cut those off mid-flight.
#
# One server, not a server-template. There is exactly one pgadmin container and
# no reason to run two -- it holds local session state, so balancing across
# replicas would log you out at random. `resolvers docker` still applies so a
# restarted container is re-resolved rather than pinned to a dead IP.
backend pgadmin_backend
    timeout client 300s
    timeout server 300s
    option httpchk GET /pgadmin/misc/ping
    http-check expect status 200
    server pgadmin pgadmin:80 check resolvers docker init-addr none

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
